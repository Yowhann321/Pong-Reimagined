<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong Reimagined</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #05060f; color: #c2c3c7; font-family: 'Press Start 2P', monospace; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  #game { width: min(100%, calc((100vh - 80px) * 16 / 9), 1280px); }
  p { font-size: 10px; line-height: 1.8; margin: 14px 0 0; text-align: center; }
</style>
</head>
<body>
<main>
  <div id="game"></div>
  <p>SPACE / CLICK / TAP = FLAP &nbsp; P = PAUSE &nbsp; M = MUTE</p>
</main>
<script src="game.js"></script>
<script>PongReimagined.mount(document.getElementById('game'));</script>
</body>
</html>
